# fonts.conf – simple system font setup

# Sans-serif family (used by 'default')
# Update the paths to valid TTF files on your system

# Linux example (DejaVu)
default      = /Users/srs57/Library/Fonts/DejaVuSans.ttf
sans         = /Users/srs57/Library/Fonts/DejaVuSans.ttf
sans_serif   = /Users/srs57/Library/Fonts/DejaVuSans.ttf
bold         = /Users/srs57/Library/Fonts/DejaVuSans-Bold.ttf
italic       = /Users/srs57/Library/Fonts/DejaVuSans-Oblique.ttf
bolditalic   = /Users/srs57/Library/Fonts/DejaVuSans-BoldOblique.ttf

# Serif family (optional; use if you want 'serif' labels)
serif        = /Users/srs57/Library/Fonts/DejaVuSerif.ttf
serif_bold   = /Users/srs57/Library/Fonts/DejaVuSerif-Bold.ttf
serif_italic = /Users/srs57/Library/Fonts/DejaVuSerif-Italic.ttf

# Monospace (for text tracks where alignment matters)
mono         = /Users/srs57/Library/Fonts/DejaVuSansMono.ttf
fixed        = /Users/srs57/Library/Fonts/DejaVuSansMono.ttf
