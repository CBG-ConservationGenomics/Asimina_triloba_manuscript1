# axes.conf – radial axes (grid lines) for data tracks

<axes>
show     = data       # draw axes on data tracks
thickness = 1p
color     = lgrey

# Axis every 0.25 of the track height (relative units 0–1)
<axis>
spacing = 0.25r      # relative to the track's radial height
</axis>

# A slightly darker axis every 0.5 of the track height
<axis>
spacing   = 0.5r
color     = grey
thickness = 2p
</axis>

# Example: explicit axes at positions instead of spacing
# <axis>
# position  = 0.2r
# color     = red
# thickness = 1p
# </axis>
#
# <axis>
# position  = 0.8r
# color     = green
# thickness = 2p
# </axis>

</axes>
