# histogram.conf – generic histogram track definitions
# All three tracks: equal height 132p (0.11r at 1200p image radius)

<plots>

  # SNPS_LDpruned histogram (outer track)
  <plot>
    type  = histogram
    file  = data/SNPS_LDpruned_r0.9_n10_100kb.smooth.hist

    # equal height: 132p; r1 at ideogram inner (no gap)
    r1    = dims(ideogram,radius_inner)
    r0    = 556p

    min   = 0
    max   = 25

    color       = genes
    fill_under  = yes
    fill_color  = genes
    thickness   = 1p
    orientation = out
    extend_bin  = no

    <<include etc/tracks/axis.conf>>
</plot>

  # Gene density (middle track) – dark purple
  <plot>
    type  = histogram
    file  = data/Asimina_triloba_gene_100kb_smooth.hist

    r1    = 564p
    r0    = 432p

    min   = 0
    max   = 75000

    color       = genes_purple
    fill_under  = yes
    fill_color  = genes_purple
    thickness   = 1p
    orientation = out
    extend_bin  = no

    <<include etc/tracks/axis.conf>>
  </plot>

  # Repeat density histogram (inner track)
  <plot>
    type  = histogram
    file  = data/Atri_repeats_100kb_smooth.hist

    # Radial position – INNER ring; equal height 132p
    r1    = 432p
    r0    = 300p

    # Value range – set to your data range
    min   = 0
    max   = 100000

    # Appearance
    color       = repeats      # defined in colors.conf
    fill_under  = yes
    fill_color  = repeats
    thickness   = 1p
    orientation = out
    extend_bin  = no

    # Optional axes/ticks for this track
    <<include etc/tracks/axis.conf>>
  </plot>

  # Chromosome length (Mb) labels below repeat track (inner edge 300p)
  # Wide r1 so stacked labels on long chr do not exceed track (Circos skips if radius+stack>r1)
  <plot>
    type = text
    file = data/mb_ticks_below_repeats.txt
    r1   = 360p
    r0   = 250p
    label_size     = 8p
    label_font     = default
    label_parallel = yes
    label_rotate   = no
    label_snuggle  = no
    rpadding = 0r
    padding  = 0r
  </plot>

</plots>
