# patterns.conf – simple fill patterns for Circos

# Syntax:
# name = path/to/pattern.png

# Generic light hatch (for highlights or background regions)
hatch_light   = etc/patterns/hatch_light.png
hatch_medium  = etc/patterns/hatch_medium.png
hatch_dark    = etc/patterns/hatch_dark.png

# Dots
dots_light    = etc/patterns/dots_light.png
dots_medium   = etc/patterns/dots_medium.png

# Diagonal stripes
diag_light    = etc/patterns/diag_light.png
diag_medium   = etc/patterns/diag_medium.png
