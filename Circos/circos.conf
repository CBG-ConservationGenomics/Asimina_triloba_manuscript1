# circos.conf

# Karyotype
karyotype = data/Asimina_triloba_karyotype.txt

# Basic genome settings
chromosomes_units           = 100000
chromosomes_display_default = yes

<ideogram>
  <spacing>
    default = 0.01r  #0.005r
  </spacing>

  radius           = 0.58r
  thickness        = 8p
  fill             = yes
  stroke_color     = dgrey
  stroke_thickness = 2p

  show_label       = yes
  label_font       = default

  # place labels outside the ideogram
  label_radius = dims(ideogram,radius_outer) + 5p
  label_size       = 30p
  label_parallel   = yes
</ideogram>

# Ticks – below inner (repeat) track: repeats r0 = 300p, ring at ~288p
<ticks>
show_ticks       = yes
show_tick_labels = no

multiplier = 1e-6
format     = %d
color      = dgrey

<tick>
radius     = 288p
spacing    = 5u
size       = 5p
thickness  = 1p
show_label = no
</tick>

<tick>
radius     = 288p
spacing    = 20u
size       = 8p
thickness  = 1p
show_label = no
</tick>
</ticks>

# Histograms
<<include etc/tracks/histogram.conf>>

# Image
<image>
<<include etc/image.conf>>
# Rotate the whole circle so ideogram 1 starts at 12 o'clock.
# Circos 0.69.10 uses <image> angle_offset (not a top-level angle_offset).
angle_offset = -90
background_opacity = 1
</image>

# Colors, fonts, patterns
<<include etc/colors_fonts_patterns.conf>>

# Housekeeping
<<include etc/housekeeping.conf>>
